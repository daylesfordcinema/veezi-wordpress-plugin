## Turn a tag into an installable plugin archive.
##
## This is the privileged half, kept in its own file for that reason: it can
## write to the repository, and it runs only on a tag push, which nobody
## without push access can produce. Nothing here is reachable from a pull
## request. CI runs first — as a called workflow rather than a copied one, so a
## release ships only what the ordinary checks passed.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  ## Not cancelled in progress: half a published release is worse than a slow
  ## one.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ## The plugin slug, which is also the repository name, the main file's name
  ## and the text domain. The suite checks those three against each other; the
  ## archive check below catches this one being wrong.
  SLUG: veezi-wordpress-plugin

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  package:
    name: Archive
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      ## The suite ties the header, the VERSION constant and readme.txt to each
      ## other. This ties all three to the tag, which is the one comparison a
      ## test cannot make — there is no tag at test time.
      - name: Check the tag against the version the plugin declares
        run: |
          set -euo pipefail

          declared="$(awk '/^ \* Version:/ { print $3; exit }' "$SLUG.php")"

          if [ "v$declared" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the declared version $declared." >&2
            echo "Bump the plugin header, the VERSION constant and readme.txt together," >&2
            echo "then tag the commit that does it." >&2
            exit 1
          fi

          echo "VERSION=$declared" >> "$GITHUB_ENV"

      ## `git archive` rather than a copy-and-delete: what stays out is
      ## declared in .gitattributes, next to the files it names, so the archive
      ## cannot quietly start carrying something new. HEAD is the tagged commit
      ## — this workflow runs on nothing else.
      - name: Build the archive
        run: |
          git archive --format=zip --prefix="$SLUG/" \
            -o "$SLUG-$VERSION.zip" HEAD

      ## Two properties, and between them there is nothing left to assume.
      ##
      ## One top-level directory, named for the slug, because WordPress names
      ## the installed plugin after whatever that directory is called.
      ##
      ## And inside it, exactly this list and nothing else. Deliberately a list
      ## of what ships rather than of what does not: an exclusion list can only
      ## repeat what .gitattributes already says, so it would agree with the
      ## archive no matter how wrong both were. This is the plugin's own
      ## surface, stated independently — it does not move when a file is added
      ## under src/, and it does not stay quiet when somebody adds a directory
      ## of development scaffold and forgets to exclude it. Which is the way
      ## this goes wrong: silently, and only visible on a live site.
      - name: Check what is in it
        run: |
          set -euo pipefail

          archive="$SLUG-$VERSION.zip"
          unzip -Z1 "$archive"

          top="$(unzip -Z1 "$archive" | cut -d/ -f1 | sort -u)"
          if [ "$top" != "$SLUG" ]; then
            echo "Expected one top-level directory named $SLUG, found: $top" >&2
            exit 1
          fi

          ships="$(printf '%s\n' \
            LICENSE README.md assets readme.txt src templates uninstall.php \
            "$SLUG.php" | sort)"

          found="$(unzip -Z1 "$archive" | sed "s|^$SLUG/||" \
            | cut -d/ -f1 | sed '/^$/d' | sort -u)"

          if ! diff -u <(printf '%s\n' "$ships") <(printf '%s\n' "$found"); then
            echo "That is not the plugin's top level. Check .gitattributes." >&2
            exit 1
          fi

      ## Create the release if the tag arrived on its own, or attach to one
      ## already published from the web interface. Either route ends with the
      ## same file on the same tag.
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          archive="$SLUG-$VERSION.zip"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$archive" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$archive" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
