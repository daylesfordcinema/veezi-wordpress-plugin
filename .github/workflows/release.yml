## Turn a tag into an installable plugin archive.
##
## This is the privileged half, kept in its own file for that reason: it can
## write to the repository, and it runs only on a tag push, which nobody
## without push access can produce. Nothing here is reachable from a pull
## request. CI runs first — as a called workflow rather than a copied one, so a
## release ships only what the ordinary checks passed.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  ## Not cancelled in progress: half a published release is worse than a slow
  ## one.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ## The plugin slug, which is also the repository name, the main file's name
  ## and the text domain. The suite checks those three against each other; the
  ## archive check below catches this one being wrong.
  SLUG: veezi-wordpress-plugin

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  package:
    name: Archive
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      ## The suite ties the header, the VERSION constant and readme.txt to each
      ## other. This ties all three to the tag, which is the one comparison a
      ## test cannot make — there is no tag at test time.
      - name: Check the tag against the version the plugin declares
        run: |
          set -euo pipefail

          declared="$(awk '/^ \* Version:/ { print $3; exit }' "$SLUG.php")"

          if [ "v$declared" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the declared version $declared." >&2
            echo "Bump the plugin header, the VERSION constant and readme.txt together," >&2
            echo "then tag the commit that does it." >&2
            exit 1
          fi

          echo "VERSION=$declared" >> "$GITHUB_ENV"

      ## `git archive` rather than a copy-and-delete: what stays out is
      ## declared in .gitattributes, next to the files it names, so the archive
      ## cannot quietly start carrying something new. HEAD is the tagged commit
      ## — this workflow runs on nothing else.
      - name: Build the archive
        run: |
          git archive --format=zip --prefix="$SLUG/" \
            -o "$SLUG-$VERSION.zip" HEAD

      ## Two properties, and between them there is nothing left to assume.
      ##
      ## One top-level directory, named for the slug, because WordPress names
      ## the installed plugin after whatever that directory is called.
      ##
      ## And inside it, exactly this list and nothing else. Deliberately a list
      ## of what ships rather than of what does not: an exclusion list can only
      ## repeat what .gitattributes already says, so it would agree with the
      ## archive no matter how wrong both were. This is the plugin's own
      ## surface, stated independently — it does not move when a file is added
      ## under src/, and it does not stay quiet when somebody adds a directory
      ## of development scaffold and forgets to exclude it. Which is the way
      ## this goes wrong: silently, and only visible on a live site.
      - name: Check what is in it
        run: |
          set -euo pipefail

          archive="$SLUG-$VERSION.zip"
          unzip -Z1 "$archive"

          top="$(unzip -Z1 "$archive" | cut -d/ -f1 | sort -u)"
          if [ "$top" != "$SLUG" ]; then
            echo "Expected one top-level directory named $SLUG, found: $top" >&2
            exit 1
          fi

          ships="$(printf '%s\n' \
            LICENSE README.md assets readme.txt src templates uninstall.php \
            "$SLUG.php" | sort)"

          found="$(unzip -Z1 "$archive" | sed "s|^$SLUG/||" \
            | cut -d/ -f1 | sed '/^$/d' | sort -u)"

          if ! diff -u <(printf '%s\n' "$ships") <(printf '%s\n' "$found"); then
            echo "That is not the plugin's top level. Check .gitattributes." >&2
            exit 1
          fi

      ## Create the release if the tag arrived on its own, or attach to one
      ## already published from the web interface. Either route ends with the
      ## same file on the same tag.
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          archive="$SLUG-$VERSION.zip"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$archive" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$archive" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

  ## Put that exact archive on the live site.
  ##
  ## This is the trigger decision ticket 12 turns on, resolved the cheapest way:
  ## a job here, `needs: package`, rather than a second workflow keyed off the
  ## release. `on: release: published` never fires for a release this workflow
  ## creates — GitHub does not start runs from events raised by GITHUB_TOKEN —
  ## and a release published by hand fires it *before* the archive exists. A job
  ## in this file needs neither: the ordering is `needs:`, not a hope, and the
  ## whole thing is still the tag-only workflow no outside contributor can reach.
  ##
  ## Nothing about the server is written here, because this file is public. The
  ## host, the account, the path and the key are the `production` environment's
  ## secrets, set once in repository settings; docs/deploying.md lists them, and
  ## that environment is also where a required reviewer can hold a deploy for a
  ## human's yes. The server runbook is in the private repository.
  deploy:
    name: Deploy to production
    needs: package
    runs-on: ubuntu-latest
    environment: production

    ## One deploy at a time across every tag, and never cancelled: a run
    ## half-way through replacing a live plugin is the single outcome worth
    ## queueing behind. A fixed group name rather than the ref, so two tags
    ## deploy one after the other instead of at once; cancel-in-progress false,
    ## so a newer tag waits rather than killing an install mid-flight.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    ## The server pulls the archive itself over HTTPS; nothing here writes to
    ## the repository.
    permissions:
      contents: read

    steps:
      ## Key-based auth from a deploy key minted in the hosting panel. The host
      ## allows no key we can install ourselves and runs intrusion protection,
      ## so a password on a retry loop risks getting the runner banned; a single
      ## keyed connection carries the whole deploy as one authentication. The
      ## key arrives as env and is written out as data with printf, so the one
      ## piece of free-form secret material here is never parsed as shell.
      ##
      ## The host key is not pinned. The connection below accepts it on first
      ## sight (`accept-new`), and a fresh runner makes every deploy a first
      ## sight — so this is trust-on-first-use each run, not a pinned identity.
      ## A deliberate trade: one fewer secret to carry, some man-in-the-middle
      ## protection given up. docs/deploying.md says so plainly.
      - name: Write the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

      ## Everything the server does, in one connection. The remote script is
      ## fed on stdin with a quoted heredoc, so the runner does not expand it;
      ## the values it needs are passed as the remote command's own environment.
      ## Those values — the slug, the tag-derived version, the asset URL built
      ## from them, and the WordPress path from a secret — are fixed or already
      ## validated (package checked the tag against the declared version), not
      ## anything a stranger supplies, so single-quoting them is enough. The one
      ## free-form secret, the key, is not among them: it was written as data
      ## above and never reaches a command line.
      - name: Install this release and prove it took
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          WP_PATH: ${{ secrets.DEPLOY_PATH }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          ## package checked the tag against the declared version already, so
          ## the version is the tag without its v, and the asset is the file
          ## package attached under exactly that name.
          version="${TAG#v}"
          asset="https://github.com/$REPO/releases/download/$TAG/$SLUG-$version.zip"

          ssh -i "$HOME/.ssh/deploy_key" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              -p "${SSH_PORT:-22}" \
              "$SSH_USER@$SSH_HOST" \
              "SLUG='$SLUG' VERSION='$version' ASSET='$asset' WP_PATH='$WP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$WP_PATH"

          ## Install exactly this archive through WordPress's own installer —
          ## the same code path a manual upload takes, so the result is the same
          ## file the admin uploader would leave. --force overwrites the running
          ## copy; a first-ever deploy lands it inactive, so activate after
          ## (a no-op, exit 0, when it is already on).
          wp plugin install "$ASSET" --force
          wp plugin activate "$SLUG"

          ## What is installed must be the tag's version, not whatever was here.
          installed="$(wp plugin get "$SLUG" --field=version)"
          if [ "$installed" != "$VERSION" ]; then
            echo "Installed version $installed is not the tagged $VERSION." >&2
            exit 1
          fi

          ## A real sync, run directly rather than waited for — the site's cron
          ## is external and off by default. `wp cron event run` exits 0 even
          ## when the sync recorded a failure, so trust the plugin's own record,
          ## not this exit code: a failure option present means the run failed,
          ## and the session count lives only in the success summary's text.
          wp cron event run veezi_sync
          if wp option get veezi_last_failure >/dev/null 2>&1; then
            echo "The post-deploy sync recorded a failure:" >&2
            wp option get veezi_last_failure --format=json >&2
            exit 1
          fi
          summary="$(wp option get veezi_last_sync --format=json)"
          sessions="$(printf '%s' "$summary" | grep -oE '[0-9][0-9,]* sessions?' | head -n1 | tr -cd '0-9' || true)"
          if [ -z "$sessions" ] || [ "$sessions" -eq 0 ]; then
            echo "The post-deploy sync yielded no sessions: $summary" >&2
            exit 1
          fi
          echo "Deployed $VERSION; sync reports $sessions sessions."

          ## Purge the page cache so a visitor gets the new version, not a
          ## stored render of the old one. The install already succeeded and was
          ## proven above, so a purge that fails is a warning, not a rollback: a
          ## stale page expires on its own, and failing here would paint a good
          ## deploy red.
          wp breeze purge --cache=all \
            || echo "Warning: page-cache purge failed; it will expire on its own." >&2
          REMOTE

      - name: Remove the key
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key"
